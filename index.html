/* ---------- hojas y avisos ---------- */
function sheet(html){$('#sheet').innerHTML=`<div class="sheetwrap" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`}
function closeSheet(){$('#sheet').innerHTML=''}
function confirmSheet(title,text,act,v,label){sheet(`<h2>${esc(title)}</h2><p class="muted" style="margin:0 0 16px">${esc(text)}</p><div class="stack" style="gap:8px"><button class="btn full" style="background:var(--period);color:#fff" data-act="${act}" data-v="${esc(v||'')}">${esc(label)}</button><button class="btn ghost full" data-act="sheet-close">Cancelar</button></div>`)}
let toastT;function toast(t){const el=$('#toast');el.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',2600)}
function colorSheet(k){const c=C();const row=COLROWS.find(x=>x[0]===k);const cur=c.colors[k];
  const prev=k==='accent'?`<div class="card blob ${tone(cur)}" style="--c:${cur};padding:18px"><div class="eyebrow" style="opacity:.7">Vista previa</div><div class="dnum" style="font-size:44px">62,5</div></div>`:`<div class="grid2"><div class="wk blob ${tone(cur)}" style="--c:${cur};min-height:96px"><span class="d">Día 1</span><span class="n">${k==='lower'?'Pierna A':'Superior A'}</span></div><div class="cal" style="grid-template-columns:repeat(3,1fr);align-content:center">${[1,2,3,4,5,6].map(i=>`<button class="${i%2?'done':''}" style="--c:${cur}" tabindex="-1">${i}</button>`).join('')}</div></div>`;
  sheet(`<h2>${row[1]}</h2>${prev}<div class="eyebrow" style="margin:16px 0 10px">Elige un color</div><div class="swatches big">${PRESETS.map(p=>`<button class="${cur.toLowerCase()===p?'on':''}" style="--c:${p}" data-act="color" data-v="${k}:${p}" aria-label="Color ${p}"></button>`).join('')}</div>
  <div class="set-row" style="margin-top:10px"><label for="colcus">Color personalizado<div class="small muted num">${cur.toUpperCase()}</div></label><input type="color" id="colcus" value="${cur}" data-color="${k}"></div>
  <div class="row" style="gap:8px;margin-top:6px"><button class="btn ghost" style="flex:1" data-act="color-reset" data-v="${k}">Restablecer</button><button class="btn" style="flex:1" data-act="sheet-close">Listo</button></div>`)}
function exPicker(mode){
  const c=C();const items=Object.entries(c.library).sort((a,b)=>a[1].name.localeCompare(b[1].name,'es'));
  sheet(`<h2>Añadir ejercicio</h2><input class="inp" id="exq" placeholder="Buscar o escribir uno nuevo" autocomplete="off" data-exq="1"><div id="exlist" style="margin-top:8px">${items.map(([id,L])=>`<button class="lrow" data-act="pick" data-v="${mode}:${id}" data-name="${esc(L.name.toLowerCase())}" style="--c:${typeColor(REGION[L.muscle])}"><span class="bar"></span><span class="t"><b>${esc(L.name)}</b><span>${L.muscle}</span></span></button>`).join('')}</div>
  <div class="card" style="background:var(--surface-2);margin-top:12px"><div class="eyebrow" style="margin-bottom:8px">Crear nuevo</div><div class="stack" style="gap:8px"><input class="inp" id="nxname" placeholder="Nombre del ejercicio" style="background:var(--surface)"><select class="inp" id="nxmus" style="background:var(--surface)">${MUSCLES.map(m=>`<option>${m}</option>`).join('')}</select><button class="btn" data-act="pick-new" data-v="${mode}">Crear y añadir</button></div></div>`);
}
function addExercise(mode,eid){
  if(mode==='plan'){const r=routine(UI.planR);r.items.push({eid,sets:3,reps:'10-12',w:'',rir:C().showRIR?2:'',rest:C().restDefault,note:'',extra:{}});UI.openItem=r.items.length-1;touch('config');closeSheet();render()}
  else{const top=UI.ov[UI.ov.length-1];const s=findS(top.id);s.ex.push({eid,sets:[{w:'',r:'',rir:'',ok:false},{w:'',r:'',rir:'',ok:false},{w:'',r:'',rir:'',ok:false}],note:''});putS(s);closeSheet();renderOv();setTimeout(()=>{const o=$('#ov');o.scrollTop=o.scrollHeight},30)}
}

/* ---------- eventos ---------- */
function curS(){const top=UI.ov[UI.ov.length-1];return top&&top.kind==='session'?findS(top.id):null}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=a.dataset.v;
  if(act==='sheet-bg'){if(e.target===a)closeSheet();return}
  const c=C();
  switch(act){
    case 'tab':UI.tab=v;UI.openItem=null;render();appScrollTop();break;
    case 'start':startSession(v);break;
    case 'open':openOv('session',v);break;
    case 'ficha':openOv('ex',v);break;
    case 'ov-back':{const top=UI.ov.pop();if(top&&top.kind==='session'){const s=findS(top.id);if(s&&!s.done&&isEmptyS(s)){delS(s);toast('Entreno vacío descartado')}}render();renderOv();break}
    case 'cal':{UI.calDir=+v;const d=P(UI.cal+'-01');d.setMonth(d.getMonth()+(+v));UI.cal=mk(iso(d));render();break}
    case 'cal-day':{const ss=sessions().filter(s=>s.date===v);
      sheet(`<h2>${fdow(v)} ${fdate(v)}</h2><button class="pdtoggle ${periodDays().has(v)?'on':''}" data-act="pday-cal" data-v="${v}" role="switch" aria-checked="${periodDays().has(v)}"><span style="display:inline-flex;width:16px;color:var(--period)">${IC.drop}</span><span style="flex:1;text-align:left">Tengo la regla este día</span><span class="toggle ${periodDays().has(v)?'on':''}" aria-hidden="true"></span></button>${ss.length?`<div class="eyebrow">Entrenos de este día</div>${ss.map(s=>`<button class="lrow" style="--c:${typeColor(s.type)}" data-act="open-close" data-v="${s.id}"><span class="bar"></span><span class="t"><b>${esc(s.name)}</b><span>${sSets(s)} series · ${fmt(sVol(s),0)} kg${s.period?' · con regla':''}</span></span></button>`).join('')}`:''}
      ${ss.length?'':`<div class="eyebrow" style="margin-top:14px">Registrar entreno</div>${c.routines.map(r=>`<button class="lrow" style="--c:${typeColor(r.type)}" data-act="log-on" data-v="${v}|${r.id}"><span class="bar"></span><span class="t"><b>${esc(r.name)}</b><span>${TYPES[r.type]} · ${r.items.length} ejercicios</span></span>${IC.right.replace('<svg','<svg width="18" height="18"')}</button>`).join('')}`}
      `);break}
    case 'pday-cal':{const on=togglePDay(v);const s2=sessions().filter(x=>x.date===v);s2.forEach(x=>{if(x.period!==on){x.period=on;putS(x)}});closeSheet();render();toast(on?'Regla marcada el '+fdate(v):'Quitada la regla del '+fdate(v));break}
    case 'pday':{const pd=new Set(D.body.pdays||[]);pd.has(v)?pd.delete(v):pd.add(v);D.body.pdays=[...pd].sort();touch('body');render();break}
    case 'pend':{const ap=activePeriod();if(!ap)break;D.body.pend=[...new Set([...(D.body.pend||[]),v])].sort();const pd=new Set(D.body.pdays||[]);pd.add(v);D.body.pdays=[...pd].sort();touch('body');closeSheet();render();toast('Regla terminada: '+(diffD(v,ap.start)+1)+' días');break}
    case 'pend-other':{const ap=activePeriod();sheet(`<h2>¿Qué día terminó?</h2><input type="date" class="inp" id="pendd" value="${today()}" min="${ap?ap.start:''}" max="${today()}"><button class="btn full" style="margin-top:12px" data-act="pend-in">Guardar</button>`);break}
    case 'pend-in':{const d=$('#pendd').value;const ap=activePeriod();if(!d||!ap||d<ap.start)break;D.body.pend=[...new Set([...(D.body.pend||[]),d])].sort();const pd=new Set(D.body.pdays||[]);pd.add(d);D.body.pdays=[...pd].sort();touch('body');closeSheet();render();toast('Regla terminada: '+(diffD(d,ap.start)+1)+' días');break}
    case 'wk-fold':UI.openWk=UI.openWk||{};UI.openWk[v]=!UI.openWk[v];render();break;
    case 'wk-more':UI.moreWk=!UI.moreWk;render();break;
    case 'demo-start':{const [r,d]=v.split('|');const old=Object.keys(D.months);D.months={};old.forEach(k=>{D.months[k]={sessions:{}};touch(k)});D.body.weights={};D.body.cycle=[];D.body.pend=[];D.body.pdays=[];c.demo=false;touch('config');touch('body');closeSheet();startSession(r,d,true);toast('Datos de ejemplo borrados. ¡A entrenar!');break}
    case 'demo-keep':{const [r,d]=v.split('|');closeSheet();startSession(r,d,true);break}
    case 'open-close':closeSheet();openOv('session',v);break;
    case 'log-on':{const [d,r]=v.split('|');closeSheet();startSession(r,d);break}
    case 'cyc-add':D.body.cycle=[...new Set([...(D.body.cycle||[]),v])].sort();D.body.pdays=[...new Set([...(D.body.pdays||[]),v])].sort();touch('body');closeSheet();render();toast('Marcado: te ha bajado el '+fdate(v));break;
    case 'cyc-del':D.body.cycle=(D.body.cycle||[]).filter(x=>x!==v);D.body.pdays=(D.body.pdays||[]).filter(x=>x!==v);touch('body');closeSheet();render();break;
    case 'cyc-other':sheet(`<h2>¿Qué día te bajó?</h2><input type="date" class="inp" id="cycd" value="${today()}" max="${today()}"><button class="btn full" style="margin-top:12px;background:var(--period);color:#fff" data-act="cyc-add-in">Guardar</button>`);break;
    case 'cyc-add-in':{const d=$('#cycd').value;if(d){D.body.cycle=[...new Set([...(D.body.cycle||[]),d])].sort();D.body.pdays=[...new Set([...(D.body.pdays||[]),d])].sort();touch('body');closeSheet();render();toast('Marcado el '+fdate(d))}break}
    case 'demo-load':{seedDemo(D);C().demoNotes=false;demoNotes();Object.keys(D.months).forEach(k=>touch(k));touch('config');touch('body');render();toast('Datos de ejemplo cargados');break}
    case 'demo-clear':{Object.keys(D.months).forEach(k=>{const ss=D.months[k].sessions||{};let ch=false;Object.keys(ss).forEach(id=>{if(ss[id].demo){delete ss[id];ch=true}});if(ch)touch(k)});if(c.demoW)c.demoW.forEach(x=>delete D.body.weights[x]);else D.body.weights={};if(c.demoCyc!==false){D.body.cycle=[];D.body.pend=[];D.body.pdays=[]}c.demoW=null;c.demoCyc=false;c.demo=false;touch('config');touch('body');render();toast('Listo. Tu rutina está lista para empezar.');break}
    // sesión
    case 's-period':{const s=curS();s.period=!s.period;putS(s);togglePDay(s.date,s.period);renderOv();break}
    case 'set-ok':{const s=curS();const [xi,si]=v.split('-').map(Number);const ex=s.ex[xi],z=ex.sets[si];
      if(!z.ok){const inp=document.querySelectorAll(`[data-row="${xi}-${si}"] input`);inp.forEach(i=>{if(i.value===''&&i.placeholder!==''){z[i.dataset.f]=i.placeholder.replace(',','.')}})}
      z.ok=!z.ok;
      if(z.ok)afterDone(s,ex,z);
      putS(s);renderOv();break}
    case 'set-add':{const s=curS();closeSheet();const ex=s.ex[+v];ex.sets.push({w:'',r:'',rir:'',ok:false});putS(s);renderOv();break}
    case 'set-del':{const s=curS();closeSheet();const ex=s.ex[+v];if(ex.sets.length>1)ex.sets.pop();putS(s);renderOv();break}
    case 'ex-skip':{const s=curS();closeSheet();const ex=s.ex[+v];ex.skip=!ex.skip;putS(s);renderOv();break}
    case 'ex-del':{const s=curS();s.ex.splice(+v,1);putS(s);renderOv();break}

/* deslizar calendario */
(function(){let x0=null,y0=0;document.addEventListener('touchstart',e=>{const c=e.target.closest&&e.target.closest('[data-swipe=cal]');if(!c){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){window.calStep&&window.calStep(dx<0?1:-1)}},{passive:true})})();
