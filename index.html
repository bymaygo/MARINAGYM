var S=[[440,956,3],[420,912,3],[402,874,3],[430,932,3],[393,852,3],[428,926,3],[390,844,3],[375,812,3],[414,896,3],[414,896,2],[414,736,3],[375,667,2]];

l.href=''+k+'-'+m[0]+'-'+(x[0]*x[2])+'x'+(x[1]*x[2])+'.jpg';document.head.appendChild(l)})});})();

<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;700;900&family=Figtree:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de teléfono, tarjetas de cristal y degradados difuminados, números en matriz de puntos, barra de iconos flotante abajo */
:root{
  --bg:#e4e4e7;
  --surface:#f6f6f7;
  --surface-2:#ececef;
  --ink:#131316;
  --muted:#85868d;
  --line:rgba(19,19,22,.09);
  --dot:rgba(19,19,22,.16);
  --lower:#ff4fa3;
  --upper:#7a6bff;
  --period:#e5484d;
  --accent:#b6ff54;
  --good:#23925f;
  --warn:#c9741c;
  --glass:rgba(246,246,247,.72);
  --font-display:'Doto', ui-monospace, 'SF Mono', monospace;
  --font-body:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:26px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#08080a;--surface:#141417;--surface-2:#1c1c20;--ink:#f1f1f3;--muted:#8b8b93;--line:rgba(255,255,255,.08);--dot:rgba(255,255,255,.14);--good:#4cc790;--warn:#f0a050;--glass:rgba(20,20,23,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#08080a;--surface:#141417;--surface-2:#1c1c20;--ink:#f1f1f3;--muted:#8b8b93;--line:rgba(255,255,255,.08);--dot:rgba(255,255,255,.14);--good:#4cc790;--warn:#f0a050;--glass:rgba(20,20,23,.7);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font-size:30px;line-height:1.05}
.top h1 span{color:var(--muted)}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;position:relative}
.card h3{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots-bg{background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:7px 7px}
.blob{position:relative;overflow:hidden;isolation:isolate}
.blob::before{content:"";position:absolute;inset:-35%;z-index:-1;background:
  radial-gradient(38% 38% at 32% 38%,var(--c),transparent 72%),
  radial-gradient(34% 34% at 72% 70%,color-mix(in oklab,var(--c) 55%,#ffd66b),transparent 72%),
  radial-gradient(30% 30% at 80% 20%,color-mix(in oklab,var(--c) 50%,#ffffff),transparent 70%);
  filter:blur(16px);opacity:.95}
.blob{background:color-mix(in oklab,var(--c) 22%,var(--surface))}
.dnum{font-family:var(--font-display);font-weight:900;letter-spacing:.02em;line-height:.9;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--c,currentColor)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--period);border:1px solid color-mix(in oklab,var(--period) 40%,transparent)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.icon-btn svg{width:19px;height:19px}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2)}
.pill.good{color:var(--good);background:color-mix(in oklab,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,transparent)}
.pill.bad{color:var(--period);background:color-mix(in oklab,var(--period) 12%,transparent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:10px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--ink)}
textarea.inp{resize:vertical;min-height:44px}
.banner{border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--dot);font-size:13px}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:30;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.14),inset 0 0 0 1px var(--line)}
.nav button{height:50px;min-width:50px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);padding:0 14px;transition:background .2s,color .2s}
.nav button svg{width:21px;height:21px}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav button span{font-size:13px;font-weight:600;display:none}
.nav button.on{width:62px}
/* week cards */
.wk{border-radius:22px;padding:14px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;background:var(--surface)}
.wk .d{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.7}
.wk .n{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.wk .s{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.wk.todo{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--c) 55%,transparent)}
.wk.todo .s{color:color-mix(in oklab,var(--c) 80%,var(--ink))}
.wk .badge{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.wk .badge svg{width:14px;height:14px}
.segbar{display:flex;gap:5px;margin:12px 0 4px}
.segbar i{flex:1;height:6px;border-radius:6px;background:var(--surface-2)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:12px;font-size:13px;font-weight:600;position:relative;display:grid;place-items:center;background:var(--surface-2)}
.cal button.out{visibility:hidden}
.cal button{isolation:isolate}
.cal button.today::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);opacity:.9;filter:blur(7px);z-index:-1}
.cal .tm{position:absolute;top:4px;right:4px;display:flex;gap:2px}
.cal .tm i{width:6px;height:6px;border-radius:50%}
.cal button.done{color:#fff;background:var(--c)}
.cal button.split{color:#fff;background:linear-gradient(135deg,var(--lower) 50%,var(--upper) 50%)}
.cal button.future{opacity:.55}
.cal .pd{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--period);box-shadow:0 0 0 1.5px var(--surface)}
.cal .pd.start{width:7px;height:7px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow:first-of-type{border-top:0}
.lrow .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t span{font-size:12.5px;color:var(--muted)}
.lrow .v{text-align:right;font-weight:600;font-size:14px}
.lrow .v small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
/* bars */
.hbar{display:grid;grid-template-columns:92px 1fr 64px;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.hbar .tr{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:var(--c)}
.hbar .val{text-align:right;color:var(--muted);font-size:12px}
.hbar .val b{color:var(--ink)}
/* tiles */
.tile{background:var(--surface-2);border-radius:18px;padding:12px}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:12px;font-weight:600}
.up{color:var(--good)} .down{color:var(--period)}
/* overlay */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov .app{padding-bottom:calc(env(safe-area-inset-bottom) + 140px)}
.ovtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ovtop .ttl{flex:1;min-width:0}
.ovtop .ttl b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* session */
.exc{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px}
.exc .hd{display:flex;align-items:flex-start;gap:10px}
.exc .hd .nm{flex:1;min-width:0}
.exc .hd .nm b{font-size:16.5px;font-weight:600;letter-spacing:-.01em;display:block}
.exc .tg{font-size:12px;color:var(--muted);margin-top:2px}
.prev{margin:10px 0 8px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.prev b{color:var(--ink);font-weight:600}
.sets{display:grid;gap:6px}
.sr{display:grid;grid-template-columns:26px 1fr 1fr;gap:6px;align-items:center}
.sr.rir{grid-template-columns:26px 1fr 1fr .75fr}
.sr .ix{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;justify-self:center;transition:background .2s,color .2s}
.sr.done .ix{background:var(--c);color:#fff}
.sr .ix{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.sr.h{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.sr input{width:100%;text-align:center;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 4px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;min-width:0}
.sr input:focus{border-color:var(--ink)}
.sr input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.ok{height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.ok svg{width:18px;height:18px}
.ok.on{background:var(--c);color:#fff}
.sr.done input{background:color-mix(in oklab,var(--c) 14%,var(--surface-2))}
.skipchip .box{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--muted);display:grid;place-items:center}
.skipchip .box svg{width:12px;height:12px}
.skipchip.on{background:var(--ink);color:var(--bg)}
.skipchip.on .box{background:var(--bg);color:var(--ink);box-shadow:none}
.exc.skipped{opacity:.6}
.exc.skipped .nm b{text-decoration:line-through}
.sug{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:12.5px;line-height:1.35}
.sug.up{padding:8px 12px;border-radius:14px;background:color-mix(in oklab,var(--good) 14%,transparent);color:var(--good)}
.sug.up b{font-weight:700}
.sug .ar{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff}
.sug .ar svg{width:12px;height:12px}
.ix.upset{color:var(--good)}
.ix i{font-style:normal;margin-left:1px}
.sug.down{color:var(--muted);font-size:12px;padding:0 2px}
.dk{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r);padding:18px;background:#0c0c0f;color:#f3f3f5}
.dk .eyebrow{color:rgba(255,255,255,.55)}
.dk .glow{position:absolute;width:80%;height:90%;border-radius:50%;background:var(--c);filter:blur(50px);opacity:.55;z-index:-1}
.hero{min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.bodymap figure{margin:0;text-align:center}
.bodymap svg{width:100%;max-width:170px;height:auto}
.bodymap figcaption{font-size:11px;color:rgba(255,255,255,.5);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.focus{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.focus:first-of-type{border-top:0}
.focus .fn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in oklab,var(--c) 22%,var(--surface-2));color:var(--c);flex:none}
.stylebar{display:flex;gap:4px;height:14px}
.stylebar i{border-radius:6px}
.tline{display:flex;flex-direction:column;gap:14px;position:relative;padding-left:22px}
.tline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tline>div{display:flex;flex-direction:column;font-size:13px;position:relative}
.tline span:last-child{color:var(--muted);line-height:1.45}
.tline .dot{position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.racard .btn{flex:none}
.perdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--period);vertical-align:middle;margin-left:4px}
.wkavg{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);align-items:flex-end}
.cbar{display:grid;grid-template-columns:96px 1fr 58px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
.cbar .cn{display:flex;align-items:center;gap:7px;font-weight:600}
.cbar .cn i{width:9px;height:9px;border-radius:50%}
.cbar .ctr{position:relative;height:12px;border-radius:6px;background:var(--surface-2)}
.cbar .ctr .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--dot)}
.cbar .ctr i{position:absolute;top:0;bottom:0;border-radius:6px}
.cbar .cv{text-align:right;font-weight:600}
.iri{overflow:hidden;isolation:isolate;background:var(--surface)}
.iri::before{content:"";position:absolute;inset:-45%;z-index:-2;background:
  radial-gradient(26% 30% at 22% 28%,#2f6bff,transparent 70%),
  radial-gradient(26% 30% at 80% 26%,#ff4fd8,transparent 70%),
  radial-gradient(30% 30% at 72% 82%,#ff5a1f,transparent 70%),
  radial-gradient(26% 28% at 24% 80%,#a8e83a,transparent 70%),
  radial-gradient(20% 22% at 52% 55%,#3fe0ff,transparent 70%);filter:blur(22px);opacity:.9}
.iri::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 65% at 50% 50%,color-mix(in oklab,var(--surface) 70%,transparent),transparent 85%)}
.iri .btn.ghost{background:color-mix(in oklab,var(--surface) 75%,transparent)}
.iri .muted{color:color-mix(in oklab,var(--ink) 70%,transparent)}
.pdays{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pdays::-webkit-scrollbar{display:none}
.pdays button{flex:none;width:46px;padding:7px 0;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:1px}
.pdays button span{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase}
.pdays button b{font-size:16px}
.pdays button.on{background:var(--period);color:#fff}
.pdays button.on span{color:rgba(255,255,255,.8)}
.rbtns{display:flex;gap:6px}
.rbtns button{height:36px;padding:0 12px;border-radius:999px;background:rgba(127,127,127,.2);font-size:12.5px;font-weight:700;white-space:nowrap}
.rwrap{position:relative;display:grid;place-items:center}
.rwrap .dnum{position:absolute}
.restbig{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:60;width:min(420px,calc(100% - 24px));display:flex;align-items:center;gap:16px;padding:14px;border-radius:30px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 14px 40px rgba(0,0,0,.2),inset 0 0 0 1px var(--line);color:var(--ink)}
.restbig .dnum{font-size:34px}
.restbig .rside{display:flex;flex-direction:column;gap:10px}

.evd .up{color:var(--good)}.evd .down{color:var(--period)}.evd.eq,.evd.new{color:var(--muted);font-weight:600}
/* --- vista en mockup de iPhone (solo en pantallas grandes, nunca en el móvil) --- */
html.mock,html.mock body{height:100%;overflow:hidden}
html.mock body{background:radial-gradient(120% 90% at 50% 0%,color-mix(in oklab,var(--bg) 70%,#fff),color-mix(in oklab,var(--bg) 85%,#000))}
.mockstage{position:fixed;inset:0;display:grid;place-items:center}
.phone{position:relative;width:418px;height:872px;border-radius:66px;padding:14px;box-sizing:border-box;background:linear-gradient(145deg,#2a2a2e,#0b0b0d 45%,#26262a);box-shadow:0 0 0 1.5px #3a3a3f,0 40px 90px rgba(0,0,0,.35),inset 0 0 0 2px #050506;transform-origin:center}
.phone::before,.phone::after{content:"";position:absolute;left:-3px;width:3px;border-radius:2px;background:#1c1c20}
.phone::before{top:180px;height:62px}.phone::after{top:256px;height:62px}
.pscreen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--bg);transform:translateZ(0)}
.pstatus{position:absolute;top:0;left:0;right:0;height:50px;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 44px;font:600 16px/1 var(--font-body);color:var(--ink);pointer-events:none;background:linear-gradient(var(--bg) 70%,transparent)}
.pstatus .isl{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.pstatus .ic{display:flex;gap:6px;align-items:center}
.pstatus svg{height:12px;width:auto}
.papp{position:absolute;inset:0;transform:translateZ(0)}
.pscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:44px;box-sizing:border-box}
.pscroll::-webkit-scrollbar{display:none}
.papp .ov{top:44px}
html.mock .toast{top:58px}
.phome{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:200;pointer-events:none}
.mocktoggle{position:fixed;top:16px;right:16px;z-index:300;padding:9px 14px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
/* --- barra inferior v3: anchos fijos, pastilla que se desliza --- */
#navc{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:30;display:flex;justify-content:center;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#navc.hidden{transform:translateY(120%);opacity:0}
#navc .nav{position:relative;left:auto;bottom:auto;transform:none;pointer-events:auto;display:grid;grid-template-columns:repeat(5,56px);gap:0;padding:6px;border-radius:999px;
  background:color-mix(in oklab,var(--surface) 62%,transparent);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  box-shadow:0 12px 32px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06),inset 0 0 0 1px color-mix(in oklab,var(--ink) 8%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
#navc .nav-pill{position:absolute;top:6px;left:6px;width:56px;height:48px;border-radius:999px;background:var(--ink);transform:translateX(calc(var(--i,0) * 56px));transition:transform .45s cubic-bezier(.3,1.35,.5,1);box-shadow:0 6px 16px color-mix(in oklab,var(--ink) 25%,transparent)}
#navc .nav button{position:relative;z-index:1;width:56px;min-width:0;height:48px;padding:0;border-radius:999px;background:transparent!important;color:var(--muted);display:grid;place-items:center;transition:color .3s}
#navc .nav button svg{width:22px;height:22px;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
#navc .nav button.on{color:var(--bg);width:56px}
#navc .nav button.on svg{transform:scale(1.06)}
#navc .nav button:active svg{transform:scale(.88)}
#navc .nav button span{display:none!important}
.adjopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
.adjopt:first-of-type{border-top:0;padding-top:4px}
.adjopt .t{flex:1;min-width:0}.adjopt .t b{display:block;font-size:15px}.adjopt .t span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.adjic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in oklab,var(--accent) 35%,var(--surface-2));color:var(--ink);flex:none}
.adjic svg{width:20px;height:20px}
.musgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.musgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:16px;background:var(--surface-2);box-shadow:inset 3px 0 0 var(--c);text-align:left}
.musgrid b{font-size:14.5px}.musgrid span{font-size:12px;color:var(--muted)}
.focushero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px;border-radius:20px;background:color-mix(in oklab,var(--c) 14%,var(--surface-2))}
.focushero .dnum{font-size:44px}.focushero .arr{font-size:22px;color:var(--muted)}.focushero .small{width:100%;color:var(--muted)}
.shead+.chiprow{flex-wrap:nowrap;overflow:visible;margin-left:0;margin-right:0;padding:2px 0;justify-content:flex-start;gap:6px}
.shead+.chiprow .chip{padding:8px 12px;font-size:13px}
.lastnote{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;padding:11px 13px;border-radius:16px;background:color-mix(in oklab,#ffb020 18%,var(--surface));font-size:13px;line-height:1.4;color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in oklab,#ffb020 35%,transparent)}
.lastnote b{font-weight:700}
.ln-ic{flex:none;width:20px;height:20px;border-radius:50%;background:#ffb020;color:#131316;font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.stack>.lastnote{margin:0}
.adjlog{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.adjlog .t{flex:1;min-width:0}.adjlog .t b{display:block;font-size:14px;font-weight:600}.adjlog .t span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.ok.on svg{animation:pop .3s ease}

/* ====== ESTILO LIMPIO (prueba) ====== */
:root[data-style=clean]{--bg:#e7e7e4;--surface:#f3f3f1;--surface-2:#e9e9e6;--ink:#111112;--muted:#8d8d89;--line:rgba(17,17,18,.08);--lower:#111112;--upper:#a3a3a0;--accent:#111112;--good:#111112;--warn:#111112;--glass:rgba(243,243,241,.8);--font-body:'Inter Tight',ui-sans-serif,system-ui,-apple-system,sans-serif;--r:24px}
@media (prefers-color-scheme: dark){:root[data-style=clean]:not([data-mode="light"]){--bg:#0b0b0c;--surface:#19191b;--surface-2:#232326;--ink:#f2f2f0;--muted:#7d7d80;--line:rgba(255,255,255,.07);--lower:#f2f2f0;--upper:#6b6b6f;--accent:#f2f2f0;--good:#f2f2f0;--warn:#f2f2f0;--glass:rgba(25,25,27,.78)}}
:root[data-style=clean][data-mode=dark]{--bg:#0b0b0c;--surface:#19191b;--surface-2:#232326;--ink:#f2f2f0;--muted:#7d7d80;--line:rgba(255,255,255,.07);--lower:#f2f2f0;--upper:#6b6b6f;--accent:#f2f2f0;--good:#f2f2f0;--warn:#f2f2f0;--glass:rgba(25,25,27,.78)}
[data-style=clean] body{letter-spacing:-.005em}
/* títulos a dos tonos */
[data-style=clean] .top>div:first-child{display:flex;flex-direction:column-reverse}
[data-style=clean] .top h1{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1}
[data-style=clean] .top .eyebrow{font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1.02;text-transform:none;color:var(--muted);opacity:.55}
[data-style=clean] .eyebrow{letter-spacing:.04em;font-weight:500}
[data-style=clean] h3{font-weight:500;letter-spacing:-.01em}
/* tarjetas planas */
[data-style=clean] .card{box-shadow:none;border:1px solid var(--line)}
[data-style=clean] .tile{border:0}
[data-style=clean] .blob,[data-style=clean] .blob.tone-light,[data-style=clean] .blob.tone-dark{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)}
[data-style=clean] .blob::before,[data-style=clean] .blob::after{opacity:0!important}
[data-style=clean] .blob .muted,[data-style=clean] .blob .eyebrow,[data-style=clean] .blob .k{color:var(--muted)!important}
[data-style=clean] .blob .badge{background:var(--ink)!important;color:var(--bg)!important}
[data-style=clean] .lrow .bar,[data-style=clean] .evr .bar{background:var(--ink);opacity:.15}
[data-style=clean] .pill.good{color:var(--ink);background:var(--surface-2)}
/* botones */
[data-style=clean] .btn{font-weight:500;letter-spacing:-.01em;padding:14px 18px}
[data-style=clean] .seg{background:transparent;border:1px solid var(--line);padding:3px}
[data-style=clean] .seg button{font-weight:500}
[data-style=clean] .seg button.on{background:var(--ink);color:var(--bg);box-shadow:none}
/* nav negra */
[data-style=clean] .nav{background:var(--ink)!important;box-shadow:0 12px 30px rgba(0,0,0,.25)!important;backdrop-filter:none;-webkit-backdrop-filter:none}
[data-style=clean] #navc .nav-pill{background:var(--bg);box-shadow:none}
[data-style=clean] #navc .nav button{color:color-mix(in oklab,var(--bg) 55%,transparent)}
[data-style=clean] #navc .nav button.on{color:var(--ink)}
/* calendario: círculos difuminados en negro / gris y hoy con aro */
[data-style=clean] .cal .h{opacity:1;font-weight:500;letter-spacing:.02em}
[data-style=clean] .cal button{font-weight:500}
[data-style=clean] .cal button.done,[data-style=clean] .cal button.split{color:var(--bg);text-shadow:none;font-weight:600}
[data-style=clean] .cal button.done::before{filter:blur(5px);inset:4px;opacity:1}
[data-style=clean] .cal button.split::before{background:linear-gradient(135deg,var(--lower) 50%,var(--upper) 50%)}
[data-style=clean] .cal button.today{color:var(--ink)!important}
[data-style=clean] .cal button.today::before{background:transparent;filter:none;inset:3px;border:1.5px solid var(--ink);opacity:1}
[data-style=clean] .cal button.today.done::before,[data-style=clean] .cal button.today.split::before{border:0;background:var(--c);filter:blur(5px)}
[data-style=clean] .cal button.today.done,[data-style=clean] .cal button.today.split{color:var(--bg)!important}
[data-style=clean] .calm{font-weight:600;letter-spacing:-.04em;font-size:28px}
[data-style=clean] .calleg i{box-shadow:none}
/* números */
[data-style=clean] .evf button.on{background:var(--ink)}
[data-style=clean] .evf button.up b,[data-style=clean] .evf button.on b{color:inherit}
[data-style=clean] .evf button.on b{color:var(--bg)}
[data-style=clean] .up,[data-style=clean] .sd.up,[data-style=clean] .evd .up,[data-style=clean] em.up,[data-style=clean] .caly b.up{color:var(--ink)!important}
[data-style=clean] .wkd .o{color:var(--bg)}
[data-style=clean] .mbar .tr i{background:var(--c)}
[data-style=clean] .mbar .tr i b{color:var(--bg)}
[data-style=clean] .ins .ic{color:var(--bg)}
[data-style=clean] .ins.warn{--k:var(--muted)}
[data-style=clean] .prc{border:1px solid var(--line)}
[data-style=clean] .evgh .dot{box-shadow:none}

[data-style=clean] .top.home>div:first-child{flex-direction:column}
[data-style=clean] .top.home .eyebrow{font-size:12px;letter-spacing:.04em;text-transform:uppercase;line-height:1.4;opacity:1;margin-bottom:6px}
[data-style=clean] .top.home h1 span{color:var(--muted);opacity:.55;font-weight:600}
[data-style=clean] .wk{border:1px solid var(--line);box-shadow:none!important;min-height:118px}
[data-style=clean] .wk .d{font-weight:500;letter-spacing:.04em;font-size:10.5px}
[data-style=clean] .wk .n{font-weight:600;letter-spacing:-.03em}
[data-style=clean] .wk.todo .s{color:var(--muted)}
[data-style=clean] .wk.blob{background:var(--surface-2)!important;border-color:transparent}
[data-style=clean] .wk.next{background:var(--ink)!important;color:var(--bg);border-color:var(--ink)}
[data-style=clean] .wk.next .s{color:var(--bg)}
[data-style=clean] .wk.next .d{opacity:.6}
[data-style=clean] .banner{border:1px solid var(--line);box-shadow:none}
[data-style=clean] .sync{background:transparent;border:1px solid var(--line)}

[data-style=clean] .cal button.done.t-upper{color:var(--ink)}
[data-style=clean]{--navbg:var(--ink);--navpill:var(--bg);--navfg:color-mix(in oklab,var(--bg) 55%,transparent);--navon:var(--ink)}
@media (prefers-color-scheme: dark){:root[data-style=clean]:not([data-mode="light"]){--navbg:#232326;--navpill:var(--ink);--navfg:var(--muted);--navon:var(--bg)}}
:root[data-style=clean][data-mode=dark]{--navbg:#232326;--navpill:var(--ink);--navfg:var(--muted);--navon:var(--bg)}
[data-style=clean] .nav{background:var(--navbg)!important}
[data-style=clean] #navc .nav-pill{background:var(--navpill)}
[data-style=clean] #navc .nav button{color:var(--navfg)}
[data-style=clean] #navc .nav button.on{color:var(--navon)}


/* rutina: tarjetas de día */
.days{display:flex;flex-direction:column;gap:10px}
.dayc{display:flex;align-items:center;gap:0;width:100%;text-align:left;background:var(--surface);border-radius:28px;padding:18px 18px 18px 0;border:1px solid var(--line);transition:transform .15s}
.dayc:active{transform:scale(.985)}
.dayc .dn{width:82px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);align-self:stretch;padding:2px 0}
.dayc .dn small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dayc .dn b{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1}
.dayc .dt{flex:1;min-width:0;padding-left:18px}
.dayc .dt b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayc .dt span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:3px}
.dayc .dt i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dayc .dch{color:var(--muted);display:flex}.dayc .dch svg{width:18px;height:18px}
.dayadd{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:28px;border:1.5px dashed color-mix(in oklab,var(--ink) 20%,transparent);color:var(--muted);font-weight:500;font-size:14px}
.dtop{align-items:center;justify-content:flex-start}
.dtop .icon-btn{background:var(--surface);flex:none}
[data-style=clean] .dtop>div{display:block}
[data-style=clean] .dtop .eyebrow{font-size:12px!important;letter-spacing:.04em;text-transform:uppercase;opacity:1;line-height:1.4;font-weight:500}

/* días entrenados del año */
.ydots{padding:22px 20px 20px}
.ydots .eyebrow{color:var(--ink)!important;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.yn{display:flex;align-items:baseline;gap:8px;margin:6px 0 18px}
.yn span{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:.9}
.yn small{font-size:16px;font-weight:500}
.yn em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.ym{display:grid;grid-template-columns:40px 1fr;gap:8px;margin-top:14px}
.ym>span{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);line-height:12px}
.ym.cur>span{color:var(--ink)}
.ym>div{display:grid;grid-template-columns:repeat(14,1fr);gap:7px 0;justify-items:center}
.ym i{width:11px;height:11px;border-radius:50%;background:color-mix(in oklab,var(--ink) 22%,transparent)}
.ym i.on{background:var(--ink)}
.ym i.fu{background:transparent;box-shadow:inset 0 0 0 1.2px color-mix(in oklab,var(--ink) 28%,transparent)}

/* evolución minimal */
.sech{display:flex;align-items:center;justify-content:space-between;margin:14px 4px -2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.nav2{display:flex;gap:2px;margin:-8px -6px}
.nav2 button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.nav2 button:disabled{opacity:.25}.nav2 svg{width:17px;height:17px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;min-height:132px;position:relative}
.tv{font-size:44px;font-weight:600;letter-spacing:-.05em;line-height:1;margin-bottom:auto}
.tv small{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:-.01em;margin-left:3px}
.tk{font-size:15px;font-weight:500;margin-top:18px}
.td{position:absolute;top:18px;right:16px;font-size:12px;font-weight:600;color:var(--muted)}
.td.down{color:var(--period)}
.ftabs{display:flex;gap:18px;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.ftabs button{font-size:14px;font-weight:500;color:var(--muted);padding:4px 0;display:flex;gap:5px;align-items:baseline;border-bottom:1.5px solid transparent}
.ftabs button b{font-size:12px;font-weight:600}
.ftabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.ftabs button.down b{color:var(--period)}
.ftabs button:disabled{opacity:.35}
.dgrp{display:flex;flex-direction:column}
.dgrp .dayc{padding-top:16px;padding-bottom:16px}
.dgrp.open .dayc{border-bottom-left-radius:10px;border-bottom-right-radius:10px}
.dpct{font-size:20px;font-weight:600;letter-spacing:-.03em;padding-left:10px}
.dpct.down{color:var(--period)}
.drows{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 28px 28px;margin-top:-1px;padding:0 20px 6px}
.drows .evr:first-child{border-top:1px solid var(--line)}
.plist{padding:4px 20px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .t{flex:1;min-width:0}.prow .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow .t span{font-size:12.5px;color:var(--muted)}
.ptag{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--ink);color:var(--bg);white-space:nowrap}
.pval{font-size:15px;font-weight:600;white-space:nowrap}
.plmore{display:block;width:100%;padding:13px 0 12px;border-top:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted)}

/* números grandes: Inter Tight gruesa en vez de pixelada */
:root[data-style=clean]{--font-display:'Inter Tight',ui-sans-serif,system-ui,-apple-system,sans-serif}
[data-style=clean] .dnum{font-weight:700;letter-spacing:-.045em;line-height:.95}
[data-style=clean] .dsep{margin:0!important;letter-spacing:0}

/* acento azul: "lo que toca ahora" */
:root[data-style=clean]{--blue:#5f74f6}
[data-style=clean] .wk.next{background:var(--blue)!important;border-color:var(--blue);color:#111112}
[data-style=clean] .wk.next .s,[data-style=clean] .wk.next .d{color:#111112}
[data-style=clean] .cal button.today::before{border-color:var(--blue)!important;border-width:2px!important}
[data-style=clean] .cal button.today.done::before,[data-style=clean] .cal button.today.split::before{border:0}
[data-style=clean] .cal button.today.done,[data-style=clean] .cal button.today.split{box-shadow:0 0 0 2px var(--blue);border-radius:50%}
[data-style=clean] #ov .sbar i,[data-style=clean] .lbar i{background:var(--blue)!important}
[data-style=clean] #ov .ovtop .pill{background:var(--blue);color:#111112}
[data-style=clean] .ptag{background:var(--blue);color:#111112}

/* calendario tipográfico */
[data-style=clean] .cal{gap:0}
[data-style=clean] .cal .h{padding-bottom:10px;font-size:11px}
[data-style=clean] .cal button{aspect-ratio:auto;height:54px;width:100%;max-width:none;border-radius:0;border-top:1px solid var(--line);background:transparent!important;font-size:25px;font-weight:500;letter-spacing:-.05em;color:color-mix(in oklab,var(--ink) 30%,transparent);text-shadow:none;place-items:start center;padding-top:9px;opacity:1!important}
[data-style=clean] .cal button.future{color:color-mix(in oklab,var(--ink) 16%,transparent)}
[data-style=clean] .cal button.done,[data-style=clean] .cal button.split{color:var(--ink)!important;font-weight:650}

[data-style=clean] .cal button.per{color:color-mix(in oklab,var(--ink) 30%,transparent)!important;font-weight:500}
[data-style=clean] .cal button.per.future{color:color-mix(in oklab,var(--ink) 16%,transparent)!important}
[data-style=clean] .cal button.per.done,[data-style=clean] .cal button.per.split{color:var(--bg)!important;font-weight:650}
[data-style=clean] .cal button.per.done.t-upper{color:var(--ink)!important}
[data-style=clean] .cal button.per.today{color:var(--ink)!important;font-weight:700}
[data-style=clean] .cal button.per.done::before,[data-style=clean] .cal button.per.split::before{box-shadow:none}
[data-style=clean] .cal button.per.today.done::before{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--blue)}
[data-style=clean] .cal button,[data-style=clean] .cal .out{height:60px}
[data-style=clean] .cal button{padding-bottom:8px}
[data-style=clean] .cal button.done::before,[data-style=clean] .cal button.split::before,[data-style=clean] .cal button.today::before{top:calc(50% - 4px)!important}
[data-style=clean] .cal .pdrop{display:block!important;top:auto!important;bottom:3px!important;left:50%!important;right:auto!important;width:5px!important;height:5px!important;margin-left:-2.5px;border-radius:50%;background:var(--period);transform:none!important}
[data-style=clean] .cal .pdrop svg{display:none}
[data-style=clean] .calleg .lp::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--period);font-size:0}

/* notas de la última vez, estilo limpio */
[data-style=clean] .lastnote{background:var(--surface-2);box-shadow:none;border-radius:14px;padding:12px 14px;gap:12px;font-size:13.5px}
[data-style=clean] .lastnote .ln-ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--on-accent,#fff);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
[data-style=clean] .lastnote b{font-weight:600}
[data-style=clean] #ov .stack>.lastnote{background:var(--surface);border:1px solid var(--line)}

.sfoot.sig{text-align:center;margin-top:22px;display:flex;flex-direction:column;gap:2px;font-weight:600;letter-spacing:.06em}
.sfoot.sig span{font-weight:500;letter-spacing:0;font-size:12.5px;font-style:italic}

/* análisis minimal */
.ra2{gap:12px}
.rahero{padding:22px 20px 20px}
.rasc{display:flex;align-items:baseline;gap:6px}
.rasc span{font-size:80px;font-weight:700;letter-spacing:-.06em;line-height:.85}
.rasc small{font-size:20px;font-weight:600;color:var(--muted)}
.rahero b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:12px}
.rahero p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.ral{padding:4px 18px}
.rai{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.rai:first-child{border-top:0}
.ric{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:-1px}
.ric svg{width:13px;height:13px}
.rai.ok .ric{background:var(--ink);color:var(--bg)}
.rai.wa .ric{background:transparent;box-shadow:inset 0 0 0 1.6px var(--ink);color:var(--ink)}
.ram{display:grid;grid-template-columns:84px 1fr 26px 62px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ram:first-child{border-top:0}
.ram .n{font-weight:500}
.ram .b{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}.ram .b i{display:block;height:100%;border-radius:6px}
.ram>b{text-align:right;font-variant-numeric:tabular-nums}
.ram .s{font-size:11px;font-weight:600;color:var(--muted);text-align:right}
.ram .s.bad{color:var(--period)}
.rafoot{font-size:12px;color:var(--muted);margin:4px 0 12px;line-height:1.4}
.rastyle{display:flex;height:10px;border-radius:10px;overflow:hidden;gap:3px;margin:16px 0 12px}
.rastyle i{display:block;height:100%;border-radius:10px}
.ralg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-bottom:14px}
.ralg span{display:inline-flex;align-items:center;gap:6px}.ralg i{width:8px;height:8px;border-radius:50%}.ralg b{color:var(--ink)}
.rat{display:flex;gap:16px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.rat:first-child{border-top:0}
.rat b{flex:none;width:62px;font-size:22px;font-weight:700;letter-spacing:-.04em}
.rat b small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}

.rsg{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.rsg:first-child{border-top:0}
.rsg .t{flex:1;min-width:0}.rsg .t b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}.rsg .t span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.rsgb{flex:none;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--blue);color:var(--on-accent,#fff)}

.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:54px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink)}
.rrow:first-child{border-top:0}
.rrow b{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow>svg{color:var(--muted);flex:none}
.rrow.pr .ric{background:var(--blue);color:var(--on-accent,#fff)}
.rrow.wa .ric{background:transparent;box-shadow:inset 0 0 0 1.6px var(--ink);color:var(--ink)}
.rrow.ok .ric{background:var(--ink);color:var(--bg)}
.rrow:active{opacity:.6}

.adjx{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.adjtick{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.6px color-mix(in oklab,var(--ink) 30%,transparent);color:var(--bg)}
.adjx.on .adjtick{background:var(--ink);box-shadow:none}
.adjtick svg{width:14px;height:14px}
.adjx .t{flex:1;min-width:0}.adjx .t>b{display:block;font-size:14.5px;font-weight:600}.adjx .t>span{font-size:12px;color:var(--muted)}
.adjx .t>span b{color:var(--ink)}
.adjx:not(.on) .t>b{color:var(--muted)}
.stepper.sm button:disabled{opacity:.3}

/* repaso final */
[data-style=clean] .top:not(.home) .eyebrow{display:none}
[data-style=clean] .top .sync{display:none!important}
.linkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 18px;color:var(--ink)}
.linkrow .t{flex:1}.linkrow .t b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}.linkrow .t span{font-size:12.5px;color:var(--muted)}
.linkrow svg{color:var(--muted)}
[data-style=clean] .adjcard{padding:6px 18px 6px}
[data-style=clean] .adjcard h3{margin:12px 0 4px}
[data-style=clean] .adjopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line);background:none!important;border-radius:0}
[data-style=clean] .adjopt .adjic{display:none}
[data-style=clean] .adjopt .t b{font-size:15.5px;font-weight:600}
[data-style=clean] .adjopt .t span{font-size:12.5px;color:var(--muted)}
[data-style=clean] .adjopt>svg{color:var(--muted)}
.cmp select{font-size:14px!important;text-overflow:ellipsis}

/* mockup: pantalla de inicio del iPhone + carga */
.spring{position:absolute;inset:0;z-index:80;background:radial-gradient(120% 80% at 30% 10%,#3a3a40,#121214 70%);display:flex;flex-direction:column;justify-content:space-between;padding:64px 22px 18px;transition:opacity .25s ease .2s}
.spring.gone{opacity:0;pointer-events:none}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;justify-items:center}
.sapp{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.sapp i,.sapp img{width:62px;height:62px;border-radius:15px;display:block}
.sapp em{font-style:normal;font-size:11px;color:#fff;min-height:13px;font-family:-apple-system,system-ui,sans-serif}
.sapp:not(.gym) em{width:34px;height:7px;min-height:0;border-radius:4px;background:rgba(255,255,255,.35);margin-top:4px}
.sapp.gym img{box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.spring.opening .gym img{transform:scale(7);opacity:0;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .3s ease .15s}
.sdock{display:flex;justify-content:space-around;padding:14px 18px;border-radius:30px;background:rgba(255,255,255,.14);backdrop-filter:blur(20px)}
.sdock i{width:58px;height:58px;border-radius:14px;display:block}
.psplash{position:absolute;inset:0;z-index:79;background:#0b0b0c;display:none;place-items:center}
.psplash.on{display:grid}
.psplash img{width:38%;transform:translate(1%,0)}
.psplash.fade{opacity:0;transition:opacity .4s ease}
.phome{cursor:pointer}

.phome{z-index:90!important;pointer-events:auto}
.phome::after{content:'';position:absolute;inset:-12px -40px}

.pscreen.darkst .pstatus{background:transparent!important;color:#fff!important;z-index:95}
.pscreen.darkst .pstatus *{color:#fff}

/* animación de entrada */
.psplash.standalone{position:fixed;z-index:9999}
.psplash img{transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .5s ease,filter .6s ease}
.psplash.out{background:transparent;transition:background .55s cubic-bezier(.4,0,.2,1) .1s}
.psplash.out img{transform:translate(1%,0) scale(1.9) rotate(-8deg);opacity:0;filter:blur(8px)}
.psplash.on.out{pointer-events:none}
.intro #root .top,.intro #root .stack>*,.intro #navc{animation:introUp .7s cubic-bezier(.2,.8,.2,1) both}
.intro #root .top{animation-delay:.12s}
.intro #root .stack>*:nth-child(1){animation-delay:.2s}
.intro #root .stack>*:nth-child(2){animation-delay:.27s}
.intro #root .stack>*:nth-child(3){animation-delay:.34s}
.intro #root .stack>*:nth-child(n+4){animation-delay:.4s}
.intro #navc{animation-name:introNav;animation-delay:.35s}
@keyframes introUp{from{opacity:0;transform:translateY(22px) scale(.98)}}
@keyframes introNav{from{opacity:0;transform:translateY(30px)}}

/* vista previa: iPhone 12 Pro Max (428×926, con notch) */
.phone{width:456px;height:954px;border-radius:68px}
.pscreen{width:428px;height:926px;border-radius:54px}
.pstatus{height:47px;padding:0 30px 0 38px}
.pstatus .isl{top:0;width:210px;height:31px;border-radius:0 0 21px 21px}
.pscroll{padding-top:47px}
.papp .ov{top:47px}
html.mock .toast{top:60px}
html.mock .restpill,html.mock .restbig{top:56px!important}
.spring{padding-top:70px}

/* móviles pequeños (iPhone SE, mini) */
@media (max-width:380px){.hname{font-size:25px}.hbtn{padding:10px 14px;font-size:14px}.hn{font-size:80px}.calm{font-size:54px!important}.cal button{font-size:17px}.tl .tv{font-size:38px}.rasc span{font-size:68px}.srow{font-size:14.5px}.seg.sm button{padding:6px 8px;font-size:12px}.exn{font-size:30px}.dayc .dn{width:70px}.dayc .dn b{font-size:34px}}
@media (max-width:340px){.hrow.end{flex-wrap:wrap;gap:12px}.hname{font-size:23px}.tgs .tg2{padding:6px 9px;font-size:12px}}

/* estrella de la home en el color de acento */
.top.home{position:relative}
.hstar{position:absolute;top:2px;right:2px;width:46px;height:40px;background:var(--blue);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

/* mejores marcas */
.prgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prt{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;min-height:150px;color:var(--ink)}
.prt:active{transform:scale(.98)}
.prt .pv{display:flex;align-items:baseline;gap:4px}
.prt .pv b{font-size:46px;font-weight:700;letter-spacing:-.05em;line-height:.9}
.prt .pv small{font-size:15px;font-weight:600;color:var(--muted)}
.prt .pr{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px;min-height:16px}
.prt .pn{margin-top:auto;padding-top:14px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.prt .pd{font-size:11.5px;color:var(--muted);margin-top:2px}
.prt .pnew{position:absolute;top:16px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--blue)}

.sidefield{display:flex!important;align-items:center;justify-content:space-between;gap:12px}
.sidefield>span{display:flex;flex-direction:column;font-size:14px;font-weight:500}.sidefield small{font-size:12px;color:var(--muted);font-weight:400}

.pedit .sidefield{grid-column:1/-1;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;padding:6px 2px}
.pedit .sidefield>span{align-items:flex-start;text-align:left}

/* iPhone: sin zoom al escribir y botones cómodos */
.sinp,.sinpw .sinp{font-size:16px!important}
input,select,textarea{font-size:max(16px,1em)}
.tg2{min-height:36px}
.seg.sm button{min-height:32px}
.stepper.sm button{width:36px;height:36px}

/* iOS 26: el documento no se desplaza; solo #root. Así el menú fijo no se mueve */
html:not(.mock),html:not(.mock) body{height:100%;overflow:hidden;overscroll-behavior:none}
html:not(.mock) #root{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
html:not(.mock) #ov.ov{overflow-x:hidden}
</style>

function suggest(it,pv){
  if(!it||!pv||!pv.sets.length)return null;
  const bw=!(pv.top.w>0);
  const up=[],down=[];
  pv.sets.forEach((z,i)=>{const rg=repsFor(it,i);const lo=+String(rg).split('-')[0]||0;const hi=repMax(rg)||lo;const r=num(z.r);if(!hi||!(r>0))return;if(r>=hi)up.push(i);else if(r<lo)down.push(i)});
  if(bw)down.length=0;
  if(!up.length&&!down.length)return null;
  return{up,down,n:pv.sets.length,bw};
}

function seedDemo(d){
  const R=rng(42);const c=d.config;c.demo=true;
  const t=today();const ws0=wkStart(t);
  const cyc=[addD(t,-9),addD(t,-37),addD(t,-65)];const hasCyc=(d.body.pdays||[]).length>0;if(!hasCyc){d.body.cycle=cyc.slice().sort();d.body.pend=cyc.map(x=>addD(x,4)).sort();d.body.pdays=cyc.flatMap(x=>[0,1,2,3,4].map(k=>addD(x,k))).sort()}c.demoCyc=!hasCyc;
  const busy=new Set();Object.values(d.months).forEach(m=>Object.values(m.sessions||{}).forEach(x=>busy.add(x.date)));const dw=[];
  const inPeriod=ds=>cyc.some(c0=>{const k=diffD(ds,c0);return k>=0&&k<5});
  for(let w=9;w>=0;w--){
    const ws=addD(ws0,-7*w);
    [0,1,3,4].forEach((off,ri)=>{
      const ds=addD(ws,off);if(ds>=t||busy.has(ds))return;
      if((w===6&&ri===3)||(w===2&&ri===2))return;
      const r=c.routines[ri];const prog=(9-w);
      const s={id:'demo'+w+ri,date:ds,rid:r.id,name:r.name,type:r.type,startedAt:P(ds).getTime()+18*36e5,endedAt:P(ds).getTime()+19.1*36e5,done:true,period:inPeriod(ds),note:'',demo:true,ex:[]};
      r.items.forEach(it=>{
        const base=c.library[it.eid].base;
        let w0=base*(1+0.016*prog);w0=Math.round(w0*2)/2;if(R()<.15)w0=Math.max(0,w0-2.5);
        const sets=[];for(let k=0;k<it.sets;k++){const rg=repsFor(it,k);const lo=+rg.split('-')[0]||8;const hi=repMax(rg)||lo;let rr=Math.max(lo-1,Math.min(hi,Math.round(lo+(hi-lo)*R()+ (k?-R():.6))));if(w<=1&&it.eid.length%3===0)rr=hi;if(w<=1&&it.eid==='gemprensa')rr=lo-2;sets.push({w:base?String(w0):'',r:String(rr),rir:String(1+Math.round(R()*2)),ok:true});}
        s.ex.push({eid:it.eid,sets,note:(it.eid==='hipthrustmp'&&w===1)?'Muy bien la pausa, subir la próxima':''});
      });
      const k=mk(ds);(d.months[k]=d.months[k]||{_t:1,sessions:{}}).sessions[s.id]=s;
    });
  }
  let bw=61.0;
  for(let i=70;i>=0;i--){const ds=addD(t,-i);bw+=0.022+(R()-.5)*.05;if(R()<.18)continue;if(d.body.weights[ds]!=null)continue;d.body.weights[ds]=Math.round((bw+(R()-.5)*.6)*10)/10;dw.push(ds)}
  c.demoW=dw;return d;
}

let DB=null,UID=null,dirty=new Set(),flushT=null,flushing=false;
function docKey(k){return k==='config'||k==='body'?k:'m-'+k}
function docBody(k){if(k==='config')return D.config;if(k==='body')return D.body;return D.months[k]||{_t:Date.now(),sessions:{}}}
function touch(k){

  if(k==='config')D.config._t=now;else if(k==='body')D.body._t=now;else{D.months[k]=D.months[k]||{sessions:{}};D.months[k]._t=now}
  saveLocal();dirty.add(k);clearTimeout(flushT);flushT=setTimeout(flush,900);
}
async function flush(){
  if(!DB||!UID||flushing||!dirty.size){return}
  flushing=true;setSync('saving');
  try{
    while(dirty.size){
      const k=dirty.values().next().value;dirty.delete(k);
      const body=JSON.parse(JSON.stringify(docBody(k)));
      try{await DB.collection('data/users/'+UID).doc(docKey(k)).set(body)}
      catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await DB.collection('data/users/'+UID).doc(docKey(k)).set(body)}catch(e2){dirty.add(k);throw e2}}
        else{dirty.add(k);throw e}
      }
    }
    setSync('ok');
  }catch(e){
    if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'||e.code==='capability_disabled')){DB=null;setSync('local')}
    else if(e&&e.code==='quota_exceeded'){setSync('full')}
    else setSync('err');
  }
  flushing=false;
  if(dirty.size&&DB){clearTimeout(flushT);flushT=setTimeout(flush,3000)}
}
function setSync(s){UI.sync=s;const el=document.getElementById('syncdot');if(el){el.className='sync '+syncCls();el.innerHTML='<i></i>'+syncTxt();el.title=syncTxt()}}
function syncTxt(){return {ok:'Guardado',saving:'Guardando…',local:'En este móvil',err:'Sin conexión',full:'Espacio lleno',loading:'Conectando…'}[UI.sync]||''}
function syncCls(){return UI.sync==='ok'?'good':(UI.sync==='err'||UI.sync==='full')?'warn':''}
async function connect(){
  if(!window.claude||!window.claude.use)return;
  UI.sync='loading';
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(!db||!user){setSync('local');return}
  let id=null;try{id=await user.id()}catch(e){}
  if(!id){setSync('local');return}
  DB=db;UID=id;
  let snap=null;
  const timer=setTimeout(()=>{if(!snap)setSync('err')},10000);
  try{snap=await DB.collection('data/users/'+UID).get()}catch(e){clearTimeout(timer);setSync(e&&e.code==='unavailable'?'err':'local');if(!(e&&e.code==='unavailable'))DB=null;return}
  clearTimeout(timer);
  const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
  let changed=false;
  const pick=(k,loc,set)=>{const r=remote[docKey(k)];if(r&&(!loc||(r._t||0)>(loc._t||0))){set(JSON.parse(JSON.stringify(r)));changed=true}else if(loc){dirty.add(k)}};
  pick('config',D.config,v=>D.config=v);
  pick('body',D.body,v=>D.body=v);
  const keys=new Set(Object.keys(D.months));Object.keys(remote).forEach(k=>{if(k.startsWith('m-'))keys.add(k.slice(2))});
  keys.forEach(k=>pick(k,D.months[k],v=>D.months[k]=v));
  normalize();demoNotes();
  if(changed){VER++;saveLocal();render();renderOv()}
  setSync('ok');
  if(dirty.size)flush();
}

function setRest(el,key,html){const cur=el.firstElementChild;

function restRing(sz,sw,fr){const r=(sz-sw)/2,cf=2*Math.PI*r;return `<svg class="rring" viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ink)"/><stop offset="1" style="stop-color:var(--muted)"/></linearGradient></defs><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${cf}" stroke-dashoffset="${cf*(1-fr)}" transform="rotate(-90 ${sz/2} ${sz/2})"/></svg>`}

  else setRest(el,'restpill'+(restUp?'u':'d'),`<div class="restpill" role="timer" aria-label="Descanso"><span class="small" style="opacity:.7;font-weight:600">Descanso</span><span class="dnum">${tm}</span>${btns}</div>`)}

const SMALLM=['Bíceps','Tríceps','Gemelo','Core','Aductores'];
const LOOK={'Glúteo':'Más volumen y forma, también en la parte alta y lateral','Cuádriceps':'Pierna más definida por delante y más fuerza en prensa y sentadilla','Isquios':'Parte trasera de la pierna marcada y cadera más estable','Espalda':'Espalda ancha que estrecha la cintura (efecto V) y mejor postura','Hombro':'Hombros redondeados y anchos, la cintura se ve más fina','Pecho':'Parte alta del torso más llena','Bíceps':'Brazo más tonificado por delante','Tríceps':'Brazo firme por detrás','Aductores':'Cara interna del muslo más firme','Gemelo':'Gemelos más marcados','Core':'Abdomen fuerte y estable'};
function computeRA(){
  const c=C(),R=c.routines.filter(r=>r.items.length);
  if(!R.length)return null;
  const direct={},indirect={},days={},sets=[];
  R.forEach(r=>{const seen=new Set();r.items.forEach(it=>{const L=lib(it.eid);const n=+it.sets||0;direct[L.muscle]=(direct[L.muscle]||0)+n;seen.add(L.muscle);
    SECONDARY.forEach(([re,m])=>{if(m!==L.muscle&&re.test(L.name)){indirect[m]=(indirect[m]||0)+n;seen.add(m)}});
    for(let i=0;i<n;i++)sets.push(repsFor(it,i));});
    seen.forEach(m=>days[m]=(days[m]||0)+1)});
  const eff=m=>(direct[m]||0)+(indirect[m]||0)/2;
  const status=(m,v)=>{const sm=SMALLM.includes(m);const lo=sm?6:10,hi=sm?16:20;if(v<lo*0.6)return['bad','Bajo'];if(v<lo)return['warn','Moderado'];if(v<=hi)return['good','Óptimo'];return['warn','Alto']};
  const ranked=MUSCLES.filter(m=>direct[m]||indirect[m]).map(m=>{const e=eff(m);return{m,d:direct[m]||0,i:indirect[m]||0,e,f:days[m]||0,st:status(m,e)}}).sort((a,b)=>b.e-a.e);
  const total=Object.values(direct).reduce((a,b)=>a+b,0);
  const items=R.flatMap(r=>r.items);
  const lo=x=>+String(x).split('-')[0]||0,hi=x=>repMax(x)||lo(x);
  const heavy=sets.filter(x=>hi(x)&&hi(x)<=8).length,mid=sets.filter(x=>hi(x)>8&&hi(x)<=12).length,light=sets.filter(x=>hi(x)>12).length;
  const pyr=items.filter(it=>{const p=String(it.reps).split('/').map(s=>s.trim()).filter(Boolean);return p.length>1&&lo(p[0])<lo(p[p.length-1])}).length;
  const avgSets=total/items.length;
  const pull=direct['Espalda']||0,pushH=direct['Pecho']||0,quad=eff('Cuádriceps'),ham=eff('Isquios');
  const lat=items.filter(it=>/elevaciones lat|lateral|crucifix|en y/i.test(lib(it.eid).name)).reduce((a,it)=>a+(+it.sets||0),0);
  const longest=R.map(r=>({n:r.name,s:r.items.reduce((a,i)=>a+(+i.sets||0),0)})).sort((a,b)=>b.s-a.s)[0];
  const good=[],watch=[];
  let score=10;
  ranked.forEach(x=>{if(x.st[1]==='Bajo')score-=0.7;else if(x.st[1]==='Moderado')score-=0.25;else if(x.st[1]==='Alto')score-=0.3});
  if(!pushH&&pull){score-=0.6;watch.push(`Sin pecho ni empuje horizontal: ${pull} series de tirón frente a 0. Con 2–3 series de press inclinado equilibras el hombro.`)}
  if(quad&&ham&&ham/quad<0.6){score-=0.4;watch.push(`Isquios muy por debajo de cuádriceps: conviene acercarlos para cuidar la rodilla.`)}
  const weak=ranked.filter(x=>x.st[1]==='Moderado'||x.st[1]==='Bajo').map(x=>x.m);
  if(weak.length)watch.push(`${weak.join(', ')} ${weak.length>1?'van':'va'} algo justos de volumen. Si son prioridad, súmales 1–2 series.`);
  if(avgSets<=2.6)watch.push(`Pocas series por ejercicio (${fmt(avgSets)}): cada serie tiene que ir cerca del fallo (RIR 0–2) para que cuente.`);
  if(longest.s>24){score-=0.3;watch.push(`${longest.n} es largo (${longest.s} series). Si vas justa de tiempo, empieza por ahí a recortar.`)}
  if(lat>=9)good.push(`Mucha prioridad al hombro lateral (${lat} series): es lo que más cambia la silueta.`);
  if(quad&&ham&&ham/quad>=0.6)good.push(`Buen equilibrio entre cuádriceps e isquios.`);
  if(eff('Glúteo')>=12)good.push(`El glúteo recibe ${fmt(eff('Glúteo'))} series efectivas desde varios ángulos.`);
  if(ranked.every(x=>x.f>=2||SMALLM.includes(x.m)))good.push('Cada grupo grande se entrena 2 veces por semana: la frecuencia ideal.');
  if(pyr)good.push(`${pyr} ejercicios con serie top + back-off: fuerza e hipertrofia en el mismo ejercicio.`);
  score=Math.max(5,Math.min(10,Math.round(score*10)/10));
  const verdict=score>=9?'Rutina excelente':score>=8?'Muy buena rutina':score>=7?'Buena rutina':score>=6?'Rutina mejorable':'Rutina a revisar';
  const top=ranked.filter(x=>!['Core','Gemelo'].includes(x.m)).slice(0,3);
  return{R,total,ranked,eff,heavy,mid,light,nSets:sets.length,pyr,avgSets,longest,good,watch,score,verdict,top,lat,ph:c.phaseOn!==false?c.phase.type:null};
}

function techFor(name){const n=norm(name);const k=Object.keys(TECH).find(x=>norm(x)===n&&TECH[x][0]);return k?TECH[k]:null}
function ytUrl(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' técnica gimnasio')}
function techSheet(rid,i,name,eq){const L=lib(routine(rid).items[i].eid);const t=techFor(name);const days=C().routines.filter(x=>x.items.some(y=>y.eid===routine(rid).items[i].eid)).length;
  sheet(`<button class="linkbtn" style="margin:0 0 8px;text-decoration:none" data-act="adj-pick" data-v="${rid}|${i}">‹ Volver a las opciones</button>
  <h2 style="margin-bottom:4px">${esc(name)}</h2><div class="small muted" style="margin-bottom:14px">${L.muscle}${eq?' · '+eq:''}</div>
  ${t?`<p style="margin:0 0 12px;line-height:1.5">${esc(t[0])}</p>${t.slice(1).map(x=>`<div class="insight" style="--c:${typeColor(REGION[L.muscle])}"><i></i><span>${esc(x)}</span></div>`).join('')}`:'<p class="muted">Aún no tengo la descripción de este ejercicio. Mira el vídeo para ver la técnica.</p>'}
  <a class="btn ghost full" style="margin-top:14px;text-decoration:none" href="${ytUrl(name)}" target="_blank" rel="noopener">${IC.play.replace('<svg','<svg width="14" height="14"')} Ver vídeos de la técnica</a>
  ${days>1?`<label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" id="adjall" checked> Cambiarlo en los ${days} días donde aparece</label>`:''}
  <button class="btn full" style="margin-top:10px" data-act="adj-do" data-v="${rid}|${i}|${esc(name)}">Cambiar ${esc(L.name)} por este</button>`)}
function swapStep1(){const c=C();sheet(`<h2>¿Qué ejercicio quieres cambiar?</h2>${c.routines.map(r=>`<div class="eyebrow" style="margin:14px 0 2px">${esc(r.name)}</div>${r.items.map((it,i)=>{const L=lib(it.eid);return `<button class="lrow" style="--c:${typeColor(REGION[L.muscle])}" data-act="adj-pick" data-v="${r.id}|${i}"><span class="bar"></span><span class="t"><b>${esc(L.name)}</b><span>${L.muscle} · ${it.sets}×${esc(it.reps)}</span></span>${IC.right.replace('<svg','<svg width="16" height="16"')}</button>`}).join('')}`).join('')}`)}
function swapStep2(rid,i){const r=routine(rid),it=r.items[i],L=lib(it.eid);const opts=(CATALOG[L.muscle]||[]).filter(([n])=>norm(n)!==norm(L.name)&&freshOpt(n));
  const days=C().routines.filter(x=>x.items.some(y=>y.eid===it.eid)).length;
  sheet(`<h2>Cambiar ${esc(L.name)}</h2><p class="small muted" style="margin:-4px 0 12px">Opciones para ${L.muscle.toLowerCase()}. Toca una para ver cómo se hace. Mantienes ${it.sets}×${esc(it.reps)} y tu historial del ejercicio anterior se conserva.</p>
  ${opts.length?'':`<div class="small muted" style="padding:10px 0">No me quedan ejercicios de ${L.muscle.toLowerCase()} que no hayas hecho ya. Puedes escribir uno a mano aquí abajo.</div>`}
  ${opts.map(([n,eq])=>`<button class="lrow" style="--c:${typeColor(REGION[L.muscle])}" data-act="adj-tech" data-v="${rid}|${i}|${esc(eq)}|${esc(n)}"><span class="bar"></span><span class="t"><b>${esc(n)}</b><span>${eq}${inRoutine(n)?' · ya está en tu rutina':''}${techFor(n)?' · ver técnica':''}</span></span>${IC.right.replace('<svg','<svg width="16" height="16"')}</button>`).join('')}
  <div class="row" style="margin-top:12px"><input class="inp" id="adjcustom" placeholder="Otro ejercicio…"><button class="btn sm" data-act="adj-do-custom" data-v="${rid}|${i}">Usar</button></div>
  ${days>1?`<label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" id="adjall" checked> Cambiarlo en los ${days} días donde aparece</label>`:''}`)}
function doSwap(rid,i,name){const c=C();const r=routine(rid),it=r.items[i];const old=it.eid;const L=lib(old);const nid=libByName(name,L.muscle);if(nid===old){closeSheet();return}const all=document.getElementById('adjall')?.checked;
  const ops=[];(all?c.routines:[r]).forEach(rr=>rr.items.forEach(x=>{if(x.eid===old){ops.push({t:'swap',rid:rr.id,from:old,to:nid,w:x.w});x.eid=nid;x.w=''}}));
  logAdj(`${L.name} → ${name}`,ops);touch('config');closeSheet();render();toast(`${L.name} → ${name}`)}
function logAdj(desc,ops){const c=C();c.adjLog=(c.adjLog||[]);c.adjLog.unshift({id:uid(),at:today(),desc,ops});c.adjLog=c.adjLog.slice(0,15)}
function undoAdj(id){const c=C();const e=(c.adjLog||[]).find(x=>x.id===id);if(!e)return;let ok=0;
  e.ops.slice().reverse().forEach(o=>{const r=routine(o.rid);if(!r)return;const i=r.items.findIndex(x=>x.eid===(o.t==='swap'?o.to:o.eid));if(i<0)return;const it=r.items[i];
    if(o.t==='swap'){it.eid=o.from;it.w=o.w??'';ok++}else if(o.t==='set'){it.sets=Math.max(1,(+it.sets)-1);if(o.reps!=null)it.reps=o.reps;else it.reps=repsCut(it.reps,(+it.sets)+1);ok++}else if(o.t==='cut'){it.sets=(+it.sets)+1;if(o.reps!=null)it.reps=o.reps;ok++}else if(o.t==='new'){r.items.splice(i,1);ok++}});
  c.adjLog=c.adjLog.filter(x=>x.id!==id);touch('config');render();toast(ok?'Cambio deshecho':'Ese cambio ya no se puede deshacer: la rutina cambió después')}
function focusStep1(){const A=computeRA();const val={};(A?A.ranked:[]).forEach(x=>val[x.m]=x);
  sheet(`<h2>¿En qué músculo quieres incidir más?</h2><div class="musgrid">${MUSCLES.map(m=>{const x=val[m];return `<button data-act="adj-mus" data-v="${m}" style="--c:${typeColor(REGION[m])}"><b>${m}</b><span>${x?fmt(x.e)+' series':'sin trabajo'}</span></button>`}).join('')}</div>`)}
/* copia la estructura de la rutina: series, rangos (pirámide), descanso, RIR y posición junto a los del mismo músculo */
function newExShape(day,m){const its=day.items;const mode=a=>{const c={};a.forEach(x=>{if(x!==''&&x!=null)c[x]=(c[x]||0)+1});return Object.keys(c).sort((x,y)=>c[y]-c[x])[0]};
  const same=its.filter(it=>lib(it.eid).muscle===m);const ref=same.length?same:its;
  const sets=+(mode(ref.map(it=>String(+it.sets||0))))||2;
  let reps=mode(ref.filter(it=>+it.sets===sets).map(it=>String(it.reps||'').trim()))||mode(its.map(it=>String(it.reps||'').trim()))||'8-12';
  const parts=reps.split('/').map(x=>x.trim()).filter(Boolean);if(parts.length>1&&parts.length!==sets){reps=parts.length>sets?parts.slice(0,sets).join(' / '):repsAdd(reps,parts.length,sets-parts.length)}
  const rest=mode(ref.map(it=>String(it.rest||'')))||'';const rir=mode(ref.map(it=>String(it.rir??'')))||'';
  let pos=its.length,after='';const li=its.map(it=>lib(it.eid).muscle).lastIndexOf(m);
  if(li>=0){pos=li+1;after=lib(its[li].eid).name}else{const sm=['Gemelo','Core','Aductores'];const k=its.findIndex(it=>sm.includes(lib(it.eid).muscle));if(k>0){pos=k;after=lib(its[k-1].eid).name}}
  return{sets,reps,rest,rir,pos,after}}
function focusPlan(m,mode,exName){
  const c=C(),A=computeRA();const x=A&&A.ranked.find(y=>y.m===m);const cur=x?x.e:0;const sm=SMALLM.includes(m);const hiR=sm?16:20;
  const add=Math.max(0,Math.min(sm?3:5,hiR-cur));
  const ch=[];let left=add;
  const mine=[];c.routines.forEach(r=>r.items.forEach((it,i)=>{if(lib(it.eid).muscle===m)mine.push({r,i,it,sets:+it.sets||0})}));
  if(mode==='sets'){
    // reparte +1 serie por ejercicio, hasta 4 series cada uno
    let guard=0;const plus={};
    while(left>0&&guard++<20){let any=false;mine.slice().sort((a,b)=>(a.sets+(plus[a.r.id+a.i]||0))-(b.sets+(plus[b.r.id+b.i]||0))).forEach(o=>{if(left<=0)return;const k=o.r.id+o.i;const now=o.sets+(plus[k]||0);if(now<4){plus[k]=(plus[k]||0)+1;left--;any=true}});if(!any)break}
    mine.forEach(o=>{const k=o.r.id+o.i;if(plus[k])ch.push({type:'set',rid:o.r.id,i:o.i,n:plus[k],txt:`${lib(o.it.eid).name} (${o.r.name}): ${o.sets} → ${o.sets+plus[k]} series${repsAdd(o.it.reps,o.sets,plus[k])!==o.it.reps?' · '+repsAdd(o.it.reps,o.sets,plus[k]):''}`})});
  }else{
    const reg=REGION[m];const days=c.routines.filter(r=>r.type===reg||reg==='full'||r.type==='full');const pool=(days.length?days:c.routines).slice().sort((a,b)=>a.items.reduce((s,i)=>s+(+i.sets||0),0)-b.items.reduce((s,i)=>s+(+i.sets||0),0));
    const opts=(CATALOG[m]||[]).filter(([n])=>freshOpt(n));const pick=opts.find(o=>o[0]===exName)||opts[0];
    const withM=pool.filter(r=>r.items.some(it=>lib(it.eid).muscle===m));const day=withM[0]||pool[0];
    if(pick&&day&&add>0){const S=newExShape(day,m);ch.push({type:'new',rid:day.id,name:pick[0],sets:S.sets,reps:S.reps,rest:S.rest,rir:S.rir,pos:S.pos,txt:`Añadir ${pick[0]} a ${day.name}${S.after?' después de '+S.after:''}: ${S.sets} series · ${S.reps}`});left-=S.sets}
  }
  const grow={};ch.forEach(k=>{grow[k.rid]=(grow[k.rid]||0)+(k.type==='set'?k.n:k.sets)});
  Object.keys(grow).forEach(rid=>{if(grow[rid]<3)return;const r=routine(rid);const top=A.ranked.find(y=>y.m!==m&&y.e>(SMALLM.includes(y.m)?14:16)&&r.items.some(it=>lib(it.eid).muscle===y.m&&(+it.sets||0)>2));
    if(top){const i=r.items.findIndex(it=>lib(it.eid).muscle===top.m&&(+it.sets||0)>2);ch.push({type:'cut',rid,i,txt:`Para no alargar ${r.name}: ${lib(r.items[i].eid).name} ${r.items[i].sets} → ${r.items[i].sets-1} series (${top.m.toLowerCase()} ya va sobrado)`})}});
  const after=cur+ch.reduce((s,k)=>s+(k.type==='set'?k.n:k.type==='new'?k.sets:0),0);
  return{m,cur,after,ch,sm,hiR,add,mode,mine,hasMine:mine.length>0,opts:(CATALOG[m]||[]).filter(([n])=>freshOpt(n)),pick:exName}}
function focusStep2(m,mode,exName,keep){const st=SMALLM.includes(m)?[6,16]:[10,20];
  const base=focusPlan(m,'sets');if(!mode)mode=base.hasMine?'sets':'ex';
  const P=focusPlan(m,mode,exName);UI.adjPlan=P;
  if(mode==='sets'&&P.add){if(!keep||!UI.adjSel||UI.adjSel._m!==m){UI.adjSel={_m:m};P.ch.filter(k=>k.type==='set').forEach(k=>UI.adjSel[k.rid+'|'+k.i]=k.n)}
    const sel=UI.adjSel;const ch=[];P.mine.forEach(o=>{const n=sel[o.r.id+'|'+o.i]||0;if(n>0)ch.push({type:'set',rid:o.r.id,i:o.i,n,txt:''})});
    const grow={};ch.forEach(k=>grow[k.rid]=(grow[k.rid]||0)+k.n);P.ch.filter(k=>k.type==='cut'&&(grow[k.rid]||0)>=3).forEach(k=>ch.push(k));
    P.ch=ch;P.after=P.cur+ch.reduce((a,k)=>a+(k.type==='set'?k.n:0),0)}
  let body;
  if(!P.add)body=`<p style="line-height:1.5">Ya haces <b>${fmt(P.cur)}</b> series efectivas de ${m.toLowerCase()} a la semana, en la parte alta de lo recomendable (${st[0]}–${st[1]}). Más volumen no suele dar más resultado.</p><div class="insight" style="--c:var(--good)"><i></i><span>Para darle prioridad sin añadir series: ponlo al principio de la sesión, cuando estás más fresca, y apura más cerca del fallo (RIR 0–1).</span></div>`;
  else{
    const seg=`<div class="seg" style="margin-bottom:14px"><button class="${mode==='sets'?'on':''}" data-act="adj-mode" data-v="${m}|sets">Subir series</button><button class="${mode==='ex'?'on':''}" data-act="adj-mode" data-v="${m}|ex">Añadir ejercicio</button></div>`;
    const why=mode==='sets'?`<p class="small muted" style="margin:0 0 10px;line-height:1.45">Mantienes tus ejercicios y les sumas series. Es lo más sencillo: no cambias nada de lo que ya conoces.</p>`:`<p class="small muted" style="margin:0 0 10px;line-height:1.45">Un ejercicio nuevo trabaja el músculo desde otro ángulo y suele dar más estímulo que repetir el mismo. Elige cuál:</p><div class="row" style="flex-wrap:wrap;gap:6px;margin:0 0 12px">${P.opts.map(([n])=>`<button class="chip ${(P.ch.find(k=>k.type==='new')||{}).name===n?'on':''}" data-act="adj-exsel" data-v="${m}|${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
    const empty=mode==='sets'&&!P.ch.some(k=>k.type==='set')?`<p style="line-height:1.5">No tienes ejercicios de ${m.toLowerCase()} en tu rutina a los que subir series. Prueba con "Añadir ejercicio".</p>`:'';

  const vp=pts.filter(p=>p.d>=from),va=avg.filter(p=>p.d>=from);
  h+=`<section class="card"><h3>Gráfica <span class="seg" style="padding:2px">${['1m','3m','6m','todo'].map(k=>`<button class="${UI.wrange===k?'on':''}" style="padding:5px 9px;font-size:12px" data-act="wrange" data-v="${k}">${k==='todo'?'Todo':k.toUpperCase()}</button>`).join('')}</span></h3><div class="chart">${lineChart({series:[{pts:vp.map(p=>({x:dayX(p.d),y:p.v})),color:'var(--muted)',dots:true,noline:true,r:2,dop:.4},{pts:va.map(p=>({x:dayX(p.d),y:p.v})),color:'var(--ink)',width:2.8,end:true,endLabel:va.length?fmt(va[va.length-1].v)+' kg':''}].concat(c.goals.target?[{pts:vp.length?[{x:dayX(vp[0].d),y:+c.goals.target},{x:dayX(vp[vp.length-1].d),y:+c.goals.target}]:[],color:'var(--good)',dash:true,width:1.4}]:[]),xl:xLabels(vp.map(p=>p.d)),label:'Evolución del peso'})}</div><div class="legend"><span style="--c:var(--muted)"><i style="border-radius:50%"></i>Registro diario</span><span style="--c:var(--ink)"><i></i>Media 7 días</span>${c.goals.target?`<span style="--c:var(--good)"><i></i>Objetivo ${fmt(c.goals.target)} kg</span>`:''}</div></section>`;
  // fase
  const rt=weeklyRate();const ph=c.phase.type;
  const rng={vol:[0.1,0.5],def:[-1,-0.3],mant:[-0.2,0.2]}[ph];
  let st='';if(rt){const p=rt.kg/rt.base*100;const inR=p>=rng[0]&&p<=rng[1];st=`<div class="row between" style="margin-top:12px"><div><div class="small muted">Tu ritmo (media de ${rt.weeks} semanas)</div><b class="num">${sign(Math.round(rt.kg*100)/100)} kg/sem</b> <span class="muted small">(${sign(Math.round(p*100)/100)} %)</span></div><span class="pill ${inR?'good':'warn'}">${inR?'En rango':p<rng[0]?'Por debajo':'Por encima'}</span></div><div class="small muted" style="margin-top:6px">Rango orientativo: ${fmt(rng[0])} a ${fmt(rng[1])} % del peso por semana.</div>`}
  else st='<div class="small muted" style="margin-top:12px">Apunta tu peso unos días más para ver tu ritmo semanal.</div>';
  if(c.phaseOn!==false)h+=`<section class="card"><h3>Fase actual <small>desde ${fdate(c.phase.since)}</small></h3><div class="seg">${[['vol','Volumen'],['mant','Mantenimiento'],['def','Déficit']].map(([k,l])=>`<button class="${ph===k?'on':''}" data-act="phase" data-v="${k}">${l}</button>`).join('')}</div>${st}</section>`;
  if(c.measuresOn)h+=measuresCard();
  UI._wsh=UI._wsh||{};let waRow='';
  if(wa.length){const rows=wa.slice().reverse();waRow=`<button class="hrow2" data-act="w-sheet" data-v="wa"><span class="t"><b>Media semanal</b><span>${rows.length} semanas</span></span><span class="v">${fmt(rows[0].avg)} kg</span>${IC.right.replace('<svg','<svg width="16" height="16"')}</button>`;UI._wsh.wa=`<h3 style="margin:4px 0 6px">Media semanal <small class="muted" style="font-weight:500;font-size:12px">lunes a domingo</small></h3>${rows.map((w,i)=>{const prev=rows[i+1];const d=prev?Math.round((w.avg-prev.avg)*10)/10:null;return `<div class="lrow"><span class="t"><b>${fdate(w.ws)} – ${fdate(addD(w.ws,6))}${w.per?' <span class="perdot" title="Semana con regla"></span>':''}</b><span>${w.n} ${w.n===1?'día':'días'} pesada${w.ws===cwS?' · en curso':''}</span></span><span class="v num">${fmt(w.avg)} kg<small>${d==null?'—':d?(d>0?'↑ ':'↓ ')+sign(d)+' kg':'igual'}</small></span></div>`}).join('')}${rows.some(w=>w.per)?'<div class="small muted" style="margin-top:8px"><span class="perdot"></span> Semana con regla: es normal que la media suba por retención de líquidos.</div>':''}`}
  UI._wsh.reg=`<h3 style="margin:4px 0 6px">Registros <small class="muted" style="font-weight:500;font-size:12px">${pts.length} días</small></h3>${pts.length?pts.slice().reverse().map((p,i,arr)=>{const n=arr[i+1];const d=n?Math.round((p.v-n.v)*10)/10:0;return `<div class="lrow"><span class="t"><b>${fdow(p.d)} ${fdate(p.d)}</b>${n?`<span class="${d>0?'up':d<0?'down':''}">${d?sign(d)+' kg':'igual'}</span>`:''}</span><span class="v num">${fmt(p.v)} kg</span><button class="icon-btn" style="width:32px;height:32px;background:var(--surface-2)" data-act="w-del" data-v="${p.d}" aria-label="Borrar ${fdate(p.d)}">${IC.trash.replace('<svg','<svg width="15" height="15"')}</button></div>`}).join(''):'<div class="empty">Apunta tu primer peso arriba.</div>'}`;
  if(pts.length)h+=`<section class="card hist">${waRow}<button class="hrow2" data-act="w-sheet" data-v="reg"><span class="t"><b>Registros</b><span>${pts.length} ${pts.length===1?'día':'días'} apuntados</span></span><span class="v">${fdate(pts[pts.length-1].d)}</span>${IC.right.replace('<svg','<svg width="16" height="16"')}</button></section>`;
  return h+'</div>';
}

</section>
  <div class="sgl">Temporizador de descanso</div><section class="sgc">
   ${row('Activado',tg('reston',rOn,'Temporizador de descanso'),'Salta al completar cada serie')}

  h+=`<div class="sgl">Peso</div><section class="sgc">

   ${row('Seguimiento de fase',tg('phaseon',c.phaseOn!==false,'Seguimiento de fase'))}

  h+=`<div class="sgl">Copia de seguridad</div><section class="sgc">
   <button class="srow link acc" data-act="export-file"><span class="lab">Guardar copia en Archivos<small>${c.lastBackup?`Última: ${fdow(c.lastBackup)} ${fdate(c.lastBackup)}`:'Aún no has hecho ninguna'}</small></span>${chev}</button>
